name: 팔로워 알림

on:
  schedule:
    - cron: '2-59/5 * * * *'   # 5분마다 (깃허브 사정으로 늦어질 수 있음)
  workflow_dispatch:

concurrency:
  group: follower
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: fol.mjs
          sparse-checkout-cone-mode: false
      - name: 상태 가져오기
        run: |
          git fetch -q origin folstate:folstate 2>/dev/null || true
          git show folstate:folstate.json > /tmp/folstate.json 2>/dev/null || echo '{"last":null,"sent":[]}' > /tmp/folstate.json
      - name: 확인
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node fol.mjs /tmp/folstate.json
      - name: 상태 저장 (folstate 브랜치)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/st && mkdir /tmp/st && cd /tmp/st
          git init -q
          git config user.name "keysbrown-bot"
          git config user.email "keysbrown-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin folstate 2>/dev/null && git checkout -q FETCH_HEAD || true
          git checkout -q -B folstate
          cp /tmp/folstate.json folstate.json
          git add folstate.json
          if git diff --cached --quiet; then echo "변화 없음"; else git commit -qm "팔로워 상태" && git push -q origin folstate; fi
