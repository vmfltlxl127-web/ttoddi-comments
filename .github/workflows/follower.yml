name: 팔로워 알림

on:
  schedule:
    - cron: '2-59/5 * * * *'   # 5분마다 (깃허브 사정으로 늦어질 수 있음)
  workflow_dispatch:

concurrency:
  group: follower
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: fol.mjs
          sparse-checkout-cone-mode: false
      - name: 상태 가져오기
        run: |
          git fetch -q origin folstate:folstate 2>/dev/null || true
          git show folstate:folstate.json > /tmp/folstate.json 2>/dev/null || echo '{"last":null,"sent":[]}' > /tmp/folstate.json
      - name: 확인
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node fol.mjs /tmp/folstate.json
      - name: 상태 저장 (folstate 브랜치)
        run: |
          git config user.name "keysbrown-bot"
          git config user.email "keysbrown-bot@users.noreply.github.com"
          if git show-ref --quiet refs/heads/folstate; then git checkout -qf folstate; else git checkout -q --orphan folstate && git rm -rqf --cached . >/dev/null 2>&1; git clean -fdq; fi
          cp /tmp/folstate.json folstate.json
          git add folstate.json
          git diff --cached --quiet || { git commit -qm "팔로워 상태" && git push -q origin folstate; }
