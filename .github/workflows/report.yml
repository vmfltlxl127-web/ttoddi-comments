name: 매일 리포트

on:
  schedule:
    - cron: '3 0 * * *'    # 매일 오전 9:03 (한국 시간) — 리포트 보내기
    - cron: '37 * * * *'   # 매시간 37분 — 좋아요·팔로워 기록
  workflow_dispatch:        # Actions 화면에서 '지금 실행' 버튼
    inputs:
      mode:
        description: 'report = 리포트 보내기 / snap = 기록만 / titletest = 표지 인식 테스트'
        default: report

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 기록 브랜치(stats) 가져오기
        run: |
          git fetch origin stats:stats 2>/dev/null || true
          git show stats:snaps.json > snaps.json 2>/dev/null || echo "[]" > snaps.json
          git show stats:autotitles.json > autotitles.json 2>/dev/null || echo "{}" > autotitles.json
          git show stats:lastreport.txt > lastreport.txt 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 실행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "3 0 * * *" ]; then MODE=report; else MODE=snap; fi
          fi
          # 직접 실행(지금 실행 버튼)은 오늘 이미 보냈어도 다시 보냄, 자동 실행은 하루 1번만
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then export FORCE=1; fi
          node report.mjs "$MODE" snaps.json
      - name: 기록 저장 (stats 브랜치)
        if: always()
        run: |
          [ -s snaps.json ] || exit 0
          mv snaps.json /tmp/snaps.json
          mv autotitles.json /tmp/autotitles.json 2>/dev/null || true
          mv lastreport.txt /tmp/lastreport.txt 2>/dev/null || true
          git config user.name "keysbrown-bot"
          git config user.email "keysbrown-bot@users.noreply.github.com"
          if git show-ref --quiet refs/heads/stats; then git checkout -qf stats; else git checkout -q --orphan stats && git rm -rq --cached . && git clean -fdq; fi
          cp /tmp/snaps.json snaps.json
          [ -f /tmp/autotitles.json ] && cp /tmp/autotitles.json autotitles.json
          [ -f /tmp/lastreport.txt ] && cp /tmp/lastreport.txt lastreport.txt
          git add snaps.json $( [ -f autotitles.json ] && echo autotitles.json ) $( [ -f lastreport.txt ] && echo lastreport.txt )
          git diff --cached --quiet || git commit -qm "기록 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push -q origin stats
