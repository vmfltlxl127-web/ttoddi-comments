name: ocr-test
on: workflow_dispatch
jobs:
  easy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q easyocr --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python ocrtest.py easy
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
  paddle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q paddlepaddle paddleocr
      - run: python ocrtest.py paddle
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
