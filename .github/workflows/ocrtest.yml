name: ocr-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node ocrtest.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -q --orphan ocrtest && git rm -rq --cached . && git add covers && git commit -qm covers && git push -qf origin ocrtest
